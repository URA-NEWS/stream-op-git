<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イコエルAI Customer Console</title>
  <style>
    :root{color-scheme:dark;--bg:#070b12;--panel:#0f1724;--line:#29405f;--text:#f6f9ff;--muted:#9badc5;--blue:#3988ff;--orange:#ff9d2e;--green:#22d39b;--red:#ff5470}*{box-sizing:border-box;letter-spacing:0}body{margin:0;background:linear-gradient(135deg,#07101d,#05070b 55%,#111827);color:var(--text);font:15px/1.65 system-ui,"Yu Gothic UI",Meiryo,sans-serif}.wrap{max-width:1240px;margin:auto;padding:28px}.top{display:flex;justify-content:space-between;gap:16px;align-items:center;margin-bottom:22px}.top h1{margin:0;font-size:30px}.top p{margin:4px 0 0;color:var(--muted)}.badge{border:1px solid #315f9f;background:#0e1b2c;border-radius:8px;padding:8px 12px;color:#cfe2ff;font-weight:900;font-size:12px}.grid{display:grid;grid-template-columns:340px minmax(0,1fr);gap:18px}.panel{border:1px solid var(--line);background:rgba(15,23,36,.9);border-radius:8px;padding:18px}.panel h2{margin:0 0 12px;font-size:18px}.stack{display:grid;gap:12px}.field label{display:block;color:var(--muted);font-size:12px;font-weight:800;margin-bottom:6px}.input,.area{width:100%;border:1px solid #38516f;background:#0b111c;color:var(--text);border-radius:8px;padding:12px;font:inherit}.area{min-height:130px;resize:vertical}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.actions{display:flex;gap:10px;flex-wrap:wrap}button,a.btn{border:1px solid #f6f9ff;background:#f6f9ff;color:#07101d;border-radius:8px;min-height:42px;padding:10px 14px;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:#101722;color:var(--text);border-color:#38516f}.danger{background:#211019;color:#ffdbe2;border-color:#7c2e41}.ok{color:var(--green)}.warn{color:var(--orange)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#060a11;border:1px solid var(--line);border-radius:8px;padding:14px;min-height:160px}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.card{border:1px solid var(--line);background:#0a111d;border-radius:8px;padding:14px}.card span{display:block;color:var(--muted);font-size:12px}.card strong{display:block;font-size:18px;margin-top:5px}.note{border-left:4px solid var(--blue);background:#0b1424;padding:12px 14px;border-radius:8px;color:#d9e8ff}@media(max-width:900px){.grid,.row,.cards{grid-template-columns:1fr}.wrap{padding:20px}.top{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top"><div><h1>ユーザー管理画面</h1><p>キャラ設定、口調、会話の方向性、学習許可をここで調整する。</p></div><div class="badge">ONLINE ONLY</div></section>
    <section class="grid">
      <aside class="panel stack">
        <h2>接続</h2>
        <div class="field"><label>API URL</label><input id="api" class="input" placeholder="https://your-api.example.com"></div>
        <div class="field"><label>管理トークン</label><input id="token" class="input" type="password" placeholder="Bearer token"></div>
        <div class="field"><label>Character ID</label><input id="characterId" class="input"></div>
        <div class="field"><label>Stream ID</label><input id="streamId" class="input"></div>
        <div class="actions"><button id="health">接続確認</button><button class="secondary" id="load">読込</button></div>
        <div class="note">トークンはこの画面からAPIに送るだけ。GitHubには保存しない。</div>
      </aside>
      <section class="stack">
        <div class="cards">
          <div class="card"><span>キャラ</span><strong id="name">未読込</strong></div>
          <div class="card"><span>版</span><strong id="version">-</strong></div>
          <div class="card"><span>配信</span><strong id="stream">未確認</strong></div>
        </div>
        <div class="panel stack">
          <h2>プロンプトで軌道修正</h2>
          <div class="field"><label>こういうキャラにしたい、こう返してほしい、避けたい話題など</label><textarea id="instruction" class="area">コメントを拾ったら一言で終わらせず、相手の感情を拾って話を広げる。軽く質問も返す。</textarea></div>
          <div class="actions"><button id="propose">提案を作る</button><button class="secondary" id="apply">提案を適用</button></div>
          <pre id="proposal">API未接続</pre>
        </div>
        <div class="panel stack">
          <h2>学習・収益化の許可</h2>
          <div class="row"><button class="secondary" data-purpose="service_improvement">品質改善を許可</button><button class="secondary" data-purpose="model_training">AI学習を許可</button></div>
          <button class="secondary" data-purpose="external_data_sales">外部提供を許可</button>
          <pre id="permission">許可は目的ごとに分けて保存する。</pre>
        </div>
        <div class="panel stack">
          <h2>配信操作</h2>
          <div class="actions"><button class="danger" id="stop">緊急停止</button><button class="secondary" id="resume">再開</button><a class="btn secondary" id="obs" href="./scene.html?demo=1&v=3">OBS画面</a></div>
          <pre id="result">待機中</pre>
        </div>
      </section>
    </section>
  </main>
<script>
const qs=new URLSearchParams(location.search);const $=id=>document.getElementById(id);let current=null;let proposed=null;
$('api').value=qs.get('api')||'';$('characterId').value=qs.get('character_id')||'';$('streamId').value=qs.get('stream_id')||'';
function base(){return $('api').value.trim().replace(/\/$/,'')}function headers(){return {'Content-Type':'application/json',Authorization:'Bearer '+$('token').value.trim()}}async function call(path,opt={}){const res=await fetch(base()+path,{...opt,headers:{...headers(),...(opt.headers||{})}});const data=await res.json().catch(()=>({ok:false,error:'bad_json'}));if(!res.ok)throw new Error(data.error||res.status);return data}
$('health').onclick=async()=>{try{$('result').textContent=JSON.stringify(await fetch(base()+'/api/health').then(r=>r.json()),null,2)}catch(e){$('result').textContent='接続失敗: '+e.message}};
$('load').onclick=async()=>{try{const data=await call('/api/characters/'+$('characterId').value);current=data.character;$('name').textContent=current.name;$('version').textContent=current.version;$('proposal').textContent=current.prompt||'プロンプトなし';if($('streamId').value){const status=await call('/api/streams/'+$('streamId').value+'/status');$('stream').textContent=status.stream.status;$('result').textContent=JSON.stringify(status,null,2)}}catch(e){$('result').textContent='読込失敗: '+e.message}};
$('propose').onclick=async()=>{try{const data=await call('/api/characters/'+$('characterId').value+'/propose',{method:'POST',body:JSON.stringify({instruction:$('instruction').value})});proposed=data.proposal;$('proposal').textContent=JSON.stringify(data,null,2)}catch(e){$('proposal').textContent='提案失敗: '+e.message}};
$('apply').onclick=async()=>{if(!current||!proposed){$('proposal').textContent='先に読込と提案作成が必要';return}try{const data=await call('/api/characters/'+$('characterId').value+'/apply',{method:'POST',body:JSON.stringify({expected_version:current.version,...proposed})});current=data.character;$('version').textContent=current.version;$('proposal').textContent=JSON.stringify(data,null,2)}catch(e){$('proposal').textContent='適用失敗: '+e.message}};
$('stop').onclick=async()=>{try{$('result').textContent=JSON.stringify(await call('/api/streams/'+$('streamId').value+'/emergency-stop',{method:'POST'}),null,2)}catch(e){$('result').textContent='停止失敗: '+e.message}};
$('resume').onclick=async()=>{try{$('result').textContent=JSON.stringify(await call('/api/streams/'+$('streamId').value+'/resume',{method:'POST'}),null,2)}catch(e){$('result').textContent='再開失敗: '+e.message}};
document.querySelectorAll('[data-purpose]').forEach(btn=>btn.onclick=async()=>{try{const data=await call('/api/training/permissions',{method:'POST',body:JSON.stringify({tenant_id:current?.tenant_id,purpose:btn.dataset.purpose,allowed:true,evidence:'customer_console'})});$('permission').textContent=JSON.stringify(data,null,2)}catch(e){$('permission').textContent='保存失敗: '+e.message}});
</script>
</body>
</html>
