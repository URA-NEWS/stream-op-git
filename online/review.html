<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>イコエルAI Change Review</title>
  <style>
    :root{color-scheme:dark;--bg:#050912;--panel:#0d1624;--line:#263f5f;--text:#f7fbff;--muted:#94a8c0;--blue:#3a8bff;--green:#25d99a;--amber:#ffb84d;--red:#ff5470}*{box-sizing:border-box;letter-spacing:0}body{margin:0;min-height:100vh;background:linear-gradient(150deg,#050912,#091423 55%,#04070c);color:var(--text);font:15px/1.65 system-ui,"Yu Gothic UI",Meiryo,sans-serif}.wrap{max-width:1180px;margin:auto;padding:32px}.top{display:flex;justify-content:space-between;gap:16px;align-items:end;margin-bottom:22px}.top h1{font-size:36px;margin:0}.top p{color:var(--muted);margin:8px 0 0}.badge{border:1px solid #315f9f;background:#0f1a2a;border-radius:8px;padding:8px 12px;color:#cfe2ff;font-size:12px;font-weight:900}.panel{border:1px solid var(--line);background:rgba(13,22,36,.92);border-radius:8px;padding:18px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:end}.field label{display:block;font-size:12px;color:#b4c6dc;font-weight:900;margin-bottom:6px}.input{width:100%;border:1px solid #365778;background:#07101b;color:var(--text);border-radius:8px;padding:12px;font:inherit}button,a{border:1px solid #f7fbff;background:#f7fbff;color:#07101d;border-radius:8px;min-height:42px;padding:10px 14px;font-weight:900;text-decoration:none;cursor:pointer}.secondary{background:#101b2a;color:var(--text);border-color:#365778}.danger{background:#2a1018;color:#ffdce3;border-color:#873044}.list{display:grid;gap:12px}.request{border:1px solid var(--line);background:#08111d;border-radius:8px;padding:16px}.meta,.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}.actions{margin:12px 0 0}.tag{border:1px solid #33597e;background:#0d2036;border-radius:999px;padding:4px 9px;font-size:12px;color:#dcecff;font-weight:900}.pending{color:var(--amber)}.applied{color:var(--green)}.rejected{color:var(--red)}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#04080f;border:1px solid var(--line);border-radius:8px;padding:14px;margin:0;color:#dce7f8}.empty{color:var(--muted);border:1px dashed #365778;border-radius:8px;padding:26px;text-align:center}@media(max-width:780px){.top,.grid{grid-template-columns:1fr;display:grid}.wrap{padding:20px}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="top">
      <div><h1>変更依頼レビュー</h1><p>顧客が送ったキャラ設定・会話設計・学習方針の依頼を確認し、承認したものだけ本番キャラへ反映する。</p></div>
      <div class="badge">JWT / RLS</div>
    </section>
    <section class="panel">
      <div class="grid">
        <div class="field"><label>顧客API URL</label><input id="api" class="input" value="https://lcnuxfvjownsmqvuagkd.functions.supabase.co/ikoeru-customer-api"></div>
        <div class="field"><label>Supabase JWT</label><input id="token" class="input" type="password" placeholder="owner/operator JWT"></div>
        <button id="load">依頼を読む</button>
      </div>
    </section>
    <section class="panel">
      <div class="meta"><a class="secondary" href="./index.html?v=5">管理トップ</a><a class="secondary" href="./customer.html?v=2">ユーザー管理</a><a class="secondary" href="./scene.html?demo=1&v=5">OBS</a></div>
      <pre id="status">未読込</pre>
    </section>
    <section class="list" id="list"><div class="empty">JWTを入れて「依頼を読む」を押す。</div></section>
  </main>
<script>
const $=id=>document.getElementById(id);const list=$('list');let rows=[];
function base(){return $('api').value.trim().replace(/\/$/,'')}
async function call(path,opt={}){const res=await fetch(base()+path,{...opt,headers:{'Content-Type':'application/json',Authorization:'Bearer '+$('token').value.trim(),...(opt.headers||{})},cache:'no-store'});const data=await res.json().catch(()=>({ok:false,error:'bad_json'}));if(!res.ok)throw new Error(data.error||res.status);return data}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function render(items){rows=items;if(!items.length){list.innerHTML='<div class="empty">変更依頼はまだない。</div>';return}list.innerHTML=items.map(r=>`<article class="request"><div class="meta"><span class="tag ${esc(r.status)}">${esc(r.status)}</span><span class="tag">${esc(r.request_type)}</span><span class="tag">${esc(new Date(r.created_at).toLocaleString('ja-JP'))}</span></div><pre>${esc(r.instruction)}</pre>${r.status==='pending'?`<div class="actions"><button onclick="applyRequest('${esc(r.id)}')">適用</button><button class="danger" onclick="rejectRequest('${esc(r.id)}')">却下</button></div>`:''}</article>`).join('')}
async function load(){try{$('status').textContent='読込中...';const data=await call('/api/customer/change-requests');$('status').textContent=JSON.stringify({ok:data.ok,count:(data.change_requests||[]).length},null,2);render(data.change_requests||[])}catch(e){$('status').textContent='読込失敗: '+e.message+'\nJWT未入力、期限切れ、tenant_users未登録、またはowner/operator権限不足の可能性があります。'}}
async function applyRequest(id){try{$('status').textContent='適用中...';const data=await call(`/api/customer/change-requests/${id}/apply`,{method:'POST',body:JSON.stringify({note:'applied from review console'})});$('status').textContent=JSON.stringify(data,null,2);await load()}catch(e){$('status').textContent='適用失敗: '+e.message}}
async function rejectRequest(id){try{$('status').textContent='却下中...';const data=await call(`/api/customer/change-requests/${id}/reject`,{method:'POST',body:JSON.stringify({note:'rejected from review console'})});$('status').textContent=JSON.stringify(data,null,2);await load()}catch(e){$('status').textContent='却下失敗: '+e.message}}
$('load').onclick=load;window.applyRequest=applyRequest;window.rejectRequest=rejectRequest;
</script>
</body>
</html>
