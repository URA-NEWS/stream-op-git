<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>BAT キャラ操作</title><link rel="stylesheet" href="style.css"></head><body data-mode="dock"><main><header><strong>BAT <span>キャラ操作</span></strong><span id="connection" class="badge">接続中</span></header><div class="preview"><canvas id="stage" width="1920" height="1080"></canvas></div><section><label for="mic">連動するマイク</label><div class="row"><select id="mic"><option value="">読み込み中</option></select><button id="refresh" class="small">更新</button></div><div class="meter"><i id="meter"></i><b id="gate"></b></div><div class="labels"><span id="volume">無音</span><span id="mouth">口を閉じています</span></div><label for="threshold">口の開きやすさ <output id="thresholdValue">−42 dB</output></label><input id="threshold" type="range" min="-60" max="-15" value="-42"><div class="labels"><span>小さい声にも反応</span><span>大きい声だけ</span></div><div class="row"><button id="calibrate" class="secondary">無音を測る（1秒）</button><button id="test" class="secondary">口パクテスト</button></div><details><summary>マイクが一覧にないとき</summary><p>OBSの既定の入力機器を追加します。</p><button id="addMic">OBSマイクを追加</button></details></section><section><div class="toggle"><label for="auto">自動のかわいい仕草</label><input id="auto" type="checkbox" checked></div><p class="hint">45〜90秒おき。瞬きは常に自動です。</p><div class="gestures"><button data-gesture="wave">ゆらゆら</button><button data-gesture="scratch">ぽりぽり</button><button data-gesture="smoke">一服</button><button data-gesture="normal" class="secondary">いつもの顔</button></div><div class="toggle"><label for="smoking">自動で一服する</label><input id="smoking" type="checkbox" checked></div><div class="toggle"><label for="kotatsu">こたつモード</label><input id="kotatsu" type="checkbox"></div><p class="hint">こたつモードでは自動のぽりぽりを止めます。</p></section><details id="connectPanel"><summary>接続設定</summary><label>OBSパスワード<input id="password" type="password" autocomplete="off"></label><button id="connect">接続する</button><p class="hint">このPCのOBSに直接接続します。音声・パスワードは外部に送信しません。</p></details><footer id="notice">OBSのマイク音量で動きます。</footer></main><script src="app.js" defer></script></body></html>
