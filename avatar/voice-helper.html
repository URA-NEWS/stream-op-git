<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>配信用AI・マイク準備</title><link rel="stylesheet" href="style.css?v=voice1"><style>body.voice-helper{background:#111720;color:#f2f3f7;min-height:100vh}body.voice-helper p,body.voice-helper .hint{color:#c1cad8}#helperStatus{padding:12px;border-radius:8px;background:#202b3d;color:#fff}#prepareMic:disabled{opacity:.65;cursor:wait}</style><body class="voice-helper"><main><header><strong>配信用AI <span>マイク準備</span></strong></header><p>この画面をChromeで開いたまま、OBSドックでAIをON/OFFします。</p><button id="prepareMic" class="full">マイクを準備する</button><label for="helperMic">会話するマイク</label><select id="helperMic"></select><p id="helperStatus" role="status">OBSに接続中</p><button id="helperStop" class="secondary full">会話を停止する</button><p class="hint">AI音声はOBSの「BAT AI音声」から出ます。ヘッドホンを使うと二重反応を防げます。OFF中はマイク音声を送信しません。</p><div id="helperReply" aria-live="polite"></div></main><script src="vendor/soundtouch.js?v=1" defer></script><script src="voice-character.js?v=1" defer></script><script src="voice-policy.js?v=6" defer></script><script src="voice-common.js?v=1" defer></script><script src="voice-engine.js?v=5" defer></script></body></html>
