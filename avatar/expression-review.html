<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>原画固定の表情見本</title><style>*{box-sizing:border-box}body{margin:0;background:#202126;color:#f6f2e8;font-family:Meiryo,sans-serif}main{max-width:1120px;margin:auto;padding:18px}h1{font-size:20px;margin:0 0 8px}p{font-size:13px;color:#d5cfc2}.controls{display:flex;gap:10px;margin:12px 0;flex-wrap:wrap}button{background:#e9c66c;border:0;border-radius:7px;color:#222;padding:10px 18px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}figure{margin:0;background:#303239;border-radius:9px;overflow:hidden}figcaption{font-size:19px;text-align:center;padding:8px}canvas{display:block;width:100%;height:auto;background:repeating-conic-gradient(#ececec 0% 25%,#fff 0% 50%) 0 0/16px 16px}.note{font-size:12px}#status{color:#e9c66c}</style></head><body><main><h1>原画固定：喜怒哀楽の全身見本</h1><p>体・仮面の輪郭・手・衣装は同じ原画像。目と口の差分だけを持つ全身画像として表示します。</p><div class="controls"><button id="closed">口を閉じる</button><button id="open">口を開く</button><button id="blink">瞬き</button><button id="voice">口パク確認</button><button id="original">原画と比較</button></div><p id="status">読み込み中</p><div class="grid"><figure><figcaption>喜</figcaption><canvas id="joy" width="1920" height="1080"></canvas></figure><figure><figcaption>怒</figcaption><canvas id="anger" width="1920" height="1080"></canvas></figure><figure><figcaption>哀</figcaption><canvas id="sadness" width="1920" height="1080"></canvas></figure><figure><figcaption>楽</figcaption><canvas id="delight" width="1920" height="1080"></canvas></figure></div><p class="note">見本専用です。OBSのキャラ画像は変更していません。</p><p><a href="https://store.line.me/stickershop/product/25264193/ja" style="color:#e9c66c">表情の参考：ナガノの公式ちいかわスタンプ</a></p></main><script src="expression-candidate.js?v=2"></script><script>let art,open=false,blink=false,compare=false,voiceUntil=0;const image=new Image();image.onload=()=>{art=makeOriginalExpressionFrames(image);document.getElementById('status').textContent='体・輪郭を固定した全身画像4種類';draw();};image.src='assets/body.png?v=4';function draw(){if(!art)return;const i=(blink?2:0)+(open?1:0);for(const n of Object.keys(art.sets)){const g=document.getElementById(n).getContext('2d');g.clearRect(0,0,1920,1080);g.drawImage(compare?art.base:art.sets[n][i],0,0);}}document.getElementById('closed').onclick=()=>{voiceUntil=0;open=false;compare=false;draw();};document.getElementById('open').onclick=()=>{voiceUntil=0;open=true;compare=false;draw();};document.getElementById('blink').onclick=()=>{blink=true;compare=false;draw();setTimeout(()=>{blink=false;draw();},150);};document.getElementById('original').onclick=()=>{compare=!compare;draw();};document.getElementById('voice').onclick=()=>{compare=false;voiceUntil=performance.now()+4000;};function tick(t){if(t<voiceUntil){open=Math.sin(t/95)>.1;draw();}requestAnimationFrame(tick);}requestAnimationFrame(tick);</script></body></html>
