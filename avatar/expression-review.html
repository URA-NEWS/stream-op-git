<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>喜怒哀楽・全身差分</title><style>body{margin:0;background:#202126;color:#f3efe7;font-family:Meiryo,sans-serif}main{max-width:1160px;margin:auto;padding:15px}h1{font-size:20px}p{font-size:13px}button{background:#efcc6d;color:#222;border:0;border-radius:6px;padding:10px 14px;margin-right:7px;font-weight:bold;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}figure{margin:0;background:#303239;border-radius:9px;overflow:hidden}figcaption{text-align:center;font-size:20px;padding:7px}canvas{display:block;width:100%;height:auto;background:repeating-conic-gradient(#ddd 0% 25%,#fff 0% 50%) 0 0/16px 16px}#status{color:#efcc6d}</style></head><body><main><h1>喜怒哀楽・全身差分</h1><p>元の体・手・仮面の外形を保持。どの表情でも口パク・瞬きが動きます。</p><button id="closed">口を閉じる</button><button id="open">口を開く</button><button id="voice">口パク</button><button id="blink">瞬き</button><p id="status">読込中</p><div class="grid"><figure><figcaption>喜</figcaption><canvas id="joy" width="1920" height="1080"></canvas></figure><figure><figcaption>怒</figcaption><canvas id="anger" width="1920" height="1080"></canvas></figure><figure><figcaption>哀</figcaption><canvas id="sadness" width="1920" height="1080"></canvas></figure><figure><figcaption>楽</figcaption><canvas id="delight" width="1920" height="1080"></canvas></figure></div></main><script src="expressions.js?v=9"></script><script>
let images={},paletteReport={},opened=false,blinking=false,until=0,reviewFrames={};
function normalizeMotionPalette(){
 // Match every expressive layer to the original body, without changing anatomy or alpha.
 const W=1920,H=1080;
 function raster(image,body=false){const c=document.createElement('canvas');c.width=W;c.height=H;const g=c.getContext('2d',{willReadFrequently:true});if(body)g.transform(2.31100039,0.06312966,-0.06312966,2.31100039,-1505.98365482,-628.16518387);g.drawImage(image,0,0,body?image.width:W,body?image.height:H);return {canvas:c,g,data:g.getImageData(0,0,W,H)};}
 function median(a){a.sort((x,y)=>x-y);return a[Math.floor(a.length/2)]||0;}
 function sample(data,u,v){const out=[[],[],[]],b=data.data;for(let dy=-3;dy<=3;dy++)for(let dx=-3;dx<=3;dx++){const k=((Math.round(v*H)+dy)*W+Math.round(u*W)+dx)*4;if(b[k+3]>240)for(let c=0;c<3;c++)out[c].push(b[k+c]);}return out.map(median);}
 function family(r,g,b){if(r-g>25&&r-b>15)return b>g*.7?'pink':'gold';return 'neutral';}
 function colors(data){const bins={pink:[[],[],[]],gold:[[],[],[]]};const b=data.data;for(let k=0;k<b.length;k+=16){if(b[k+3]<240)continue;const f=family(b[k],b[k+1],b[k+2]);if(bins[f])for(let c=0;c<3;c++)bins[f][c].push(b[k+c]);}return Object.fromEntries(Object.entries(bins).map(([f,v])=>[f,v.map(median)]));}
 const reference=raster(images.body,true),target={head:sample(reference.data,.43,.30),suit:sample(reference.data,.59,.82),white:sample(reference.data,.39,.66),...colors(reference.data)};
 function interpolate(value,knots,values){for(let i=1;i<knots.length;i++)if(value<=knots[i])return values[i-1]+(value-knots[i-1])*(values[i]-values[i-1])/Math.max(1,knots[i]-knots[i-1]);return values[values.length-1];}
 paletteReport.reference=target;
 for(const name of ['idle','talk','blink','scratch','smoke']){
  const layer=raster(images[name]),src={head:sample(layer.data,.43,.30),suit:sample(layer.data,.59,.82),white:sample(layer.data,.39,.66),...colors(layer.data)},b=layer.data.data;
  const neutral=[0,1,2].map(c=>Array.from({length:256},(_,v)=>interpolate(v,[0,src.head[c],src.suit[c],src.white[c],255],[0,target.head[c],target.suit[c],target.white[c],255])));
  for(let k=0;k<b.length;k+=4){if(!b[k+3])continue;const f=family(b[k],b[k+1],b[k+2]);for(let c=0;c<3;c++)b[k+c]=f==='neutral'?neutral[c][b[k+c]]:Math.max(0,Math.min(255,b[k+c]+target[f][c]-src[f][c]));}
  layer.g.putImageData(layer.data,0,0);images[name]=layer.canvas;
  paletteReport[name]={head:sample(layer.data,.43,.30),suit:sample(layer.data,.59,.82),white:sample(layer.data,.39,.66),...colors(layer.data)};
 }
}


async function init(){await Promise.all(['idle','talk','blink','scratch','smoke','body'].map(n=>new Promise((resolve,reject)=>{const i=new Image();i.onload=()=>{images[n]=i;resolve();};i.onerror=reject;i.src='assets/'+n+'.png?v=4';})));normalizeMotionPalette();prepareBatEmotions(images);for(const n of ['joy','anger','sadness','delight']){reviewFrames[n]=[];for(let s=0;s<4;s++){const c=document.createElement('canvas');c.width=1920;c.height=1080;drawBatEmotion(c.getContext('2d'),n,Boolean(s&1),s>=2,'normal');reviewFrames[n].push(c);}}draw();document.getElementById('status').textContent='4表情・口の開閉・瞬きの全身差分を読込済み';}
function draw(){for(const n of ['joy','anger','sadness','delight']){const g=document.getElementById(n).getContext('2d');g.clearRect(0,0,1920,1080);g.drawImage(reviewFrames[n][(blinking?2:0)+(opened?1:0)],0,0);}}
document.getElementById('closed').onclick=()=>{until=0;opened=false;draw();};document.getElementById('open').onclick=()=>{until=0;opened=true;draw();};document.getElementById('voice').onclick=()=>{until=performance.now()+4000;};document.getElementById('blink').onclick=()=>{blinking=true;draw();setTimeout(()=>{blinking=false;draw();},130);};function tick(t){if(t<until){opened=Math.sin(t/90)>0;draw();}requestAnimationFrame(tick);}init().catch(e=>document.getElementById('status').textContent=e.message||'読込エラー');requestAnimationFrame(tick);
</script></body></html>
