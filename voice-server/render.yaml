services:
  - type: web
    name: bat-stream-voice
    runtime: node
    plan: free
    rootDir: voice-server
    buildCommand: npm install --ignore-scripts
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: OPENAI_API_KEY
        sync: false
      - key: BAT_VOICE_TOKEN
        generateValue: true
